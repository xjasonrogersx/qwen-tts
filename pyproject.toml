[project]
name = "tts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jason", email = "xjason.rogersx@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "qwen-tts>=0.1.1",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
]

[project.scripts]
tts = "tts:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
